<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FBFBFD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gusmeroli">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="icon" type="image/png" href="icona-180.png">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Operazioni Gusmeroli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: fascia scura col logo e le sezioni in alto, sotto una colonna unica larga 1120px; le cifre in Times, tutto il resto in Arial, come nei manuali Gusmeroli. */
:root{
  /* chiaro come il sito Apple: bianco, grigio chiarissimo, testo antracite, grigi puri; unico accento l’oro del marchio. Uguale di giorno e di notte */
  --bg:#FFFFFF; --panel:#F5F5F7; --ink:#1D1D1F; --ink2:#6E6E73; --line:#D2D2D7; --sand:#86868B;
  --gold:#886E46; --gold-fill:#B0905A; --gold-soft:#EFE7D9; --tint:#F7F2E7; --band:#FBFBFD; --on-band:#1D1D1F; --on-band-2:#6E6E73; --band-line:#D2D2D7; --logo:invert(1);
  --ok:#2F6B4F; --ok-bg:#E4ECE3; --warn:#8A5A12; --warn-bg:#F3E7CF; --crit:#8C2F2F; --crit-bg:#F2DEDC;
  --serif:"Times New Roman",Times,Georgia,serif; --sans:"Times New Roman",Times,Georgia,serif;
  color-scheme:light;
}

*{box-sizing:border-box}
/* dietro alla pagina c'è il blu della fascia: così sopra (barra di stato, rimbalzo dello scorrimento) non compare mai il chiaro */
html{background:var(--band)}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-fill);outline-offset:2px}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.band{background:var(--band);color:var(--on-band);border-bottom:2px solid var(--gold-fill);padding-top:env(safe-area-inset-top,0px)}
.band-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:20px 14px}
.logo{height:19px;width:auto;display:block;filter:var(--logo)}
.logo-link{display:block;padding:6px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.role{display:none}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav .ico,.nav .corto{display:none}
.nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--on-band-2);padding:10px 12px 11px;cursor:pointer;white-space:nowrap;font-size:14px}
.nav button:first-child{padding-left:0}
.nav button:hover{color:var(--on-band)}
.nav button[aria-current="page"]{color:var(--on-band);border-bottom-color:var(--gold-fill)}

main{padding-block:28px 56px;display:flex;flex-direction:column;gap:32px}
section,.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,6vw,54px);line-height:1.05;text-wrap:balance}
h2{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.2;text-wrap:balance}
h3{font-size:15px;font-weight:700}
h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:400}
.lede{color:var(--ink2);max-width:66ch}
.muted{color:var(--ink2)}
.small{font-size:13px}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums}
.prose{max-width:68ch}

.intro{flex-direction:row;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.intro-text{display:flex;flex-direction:column;gap:8px;min-width:0}
.intro-side{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.fig{padding:18px 18px 18px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.fig + .fig{padding-left:18px;border-left:1px solid var(--line)}
.fig .v{font-family:var(--serif);font-size:clamp(26px,3.6vw,40px);line-height:1.1;font-variant-numeric:tabular-nums}
.fig .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.fig .n{font-size:12px;color:var(--ink2)}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.hero-main{padding:26px 24px 26px 0;display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0}
.hero-main .l{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.hero-main .v{font-family:var(--serif);font-size:clamp(42px,7vw,64px);line-height:1;font-variant-numeric:tabular-nums;color:var(--ok)}
.buono .v{color:var(--ok)}
.tile.buono{background:var(--ok-bg)}
.hero-main .n{font-size:14px;color:var(--ink2)}
.hero-side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.hero-side .fig{flex:1;justify-content:center;padding:14px 0 14px 24px;border-left:0}
.hero-side .fig + .fig{padding-left:24px;border-left:0;border-top:1px solid var(--line)}
.hero-side .fig .v{font-size:clamp(22px,2.6vw,28px)}
.hero-side .fig:first-child .v{font-size:clamp(30px,4vw,44px)}

.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.panel{background:var(--panel);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:13px}
a{color:var(--gold);text-underline-offset:3px}

.steps{display:flex;gap:3px}
.steps span{flex:1;height:8px;background:var(--line)}
.steps .fatto{background:var(--ink)}
.steps .in-corso{background:var(--gold-fill)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 16px;align-items:baseline}
.kv dt{color:var(--ink2);font-size:13px}
.kv dd{text-align:right;font-family:var(--serif);font-size:18px;font-variant-numeric:tabular-nums}
.kv .tot{border-top:1px solid var(--ink);padding-top:7px;color:var(--ink);font-weight:700}
.scheda{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr);gap:0}
.scheda dt,.scheda dd{padding:10px 0;border-top:1px solid var(--line)}
.scheda dt{color:var(--ink2);font-size:13px;padding-right:16px}
.bar{display:flex;height:8px;background:var(--line);overflow:hidden}
.bar .a{background:var(--ink)}
.bar .b{background:var(--gold-fill)}
.bar .over{background:var(--crit)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:baseline}

.split-bar{display:flex;height:46px;gap:2px}
.split-bar div{display:flex;align-items:center;padding-inline:12px;font-family:var(--serif);font-size:18px;font-variant-numeric:tabular-nums;min-width:0;white-space:nowrap;overflow:hidden}
.split-bar .inv{background:var(--ink);color:var(--bg)}
.split-bar .inv2{background:var(--ink2);color:var(--bg)}
.split-bar .ges{background:var(--gold-fill);color:#141210}
.split-labels{display:grid;gap:2px;font-size:13px;color:var(--ink2)}
.split-labels span{min-width:0}

.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sec-head > div:first-child{display:flex;flex-direction:column;gap:4px;min-width:0}
.sec-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);padding:9px 16px;cursor:pointer;font-size:14px;border-radius:2px}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--sand)}
.btn.danger{background:transparent;color:var(--crit);border-color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:default}

.pill{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent;background:transparent;font-family:var(--sans)}
button.pill{cursor:pointer}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{border-color:var(--sand);color:var(--ink2)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.gold{border-color:var(--gold-fill);color:var(--gold)}
.pill.neutral{border-color:var(--line);color:var(--ink2)}

/* parti */
.party{border-top:2px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.party.gestore{border-top-color:var(--gold-fill)}
.party .q{font-family:var(--serif);font-size:34px;line-height:1}
.party dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.party dt{color:var(--ink2)}
.party dd{overflow-wrap:anywhere}
.schema{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr) auto minmax(0,1fr);gap:12px;align-items:center}
.schema .box{border:1px solid var(--sand);padding:14px;text-align:center;display:flex;flex-direction:column;gap:4px}
.schema .box.core{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.schema .box.core .muted{color:var(--sand)}
.schema .arrow{font-size:12px;color:var(--ink2);text-align:center;max-width:110px}
.schema .col{display:flex;flex-direction:column;gap:10px}
.regole{display:grid;grid-template-columns:minmax(140px,240px) minmax(0,1fr)}
.regole dt,.regole dd{padding:14px 0;border-top:1px solid var(--line)}
.regole dt{font-weight:700;padding-right:20px}

/* tabelle */
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
th:first-child,td:first-child{text-align:left;padding-left:0}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:400;border-bottom-color:var(--ink);vertical-align:bottom}
td.num{font-size:16px}
td.l,th.l{text-align:left}
tr.grp td{font-weight:700;background:var(--panel);padding-left:10px}
tr.grp td:first-child{padding-left:10px}
tr.sub td:first-child{padding-left:10px}
tfoot td{border-bottom:0;border-top:1px solid var(--ink);font-weight:700}
td .bar{width:90px;margin-left:auto}
.neg{color:var(--crit)}
.matrix{min-width:560px}
.matrix td,.matrix th{text-align:center}
.matrix td.here{background:var(--ink);color:var(--bg);font-weight:700}
.matrix td.lo{background:var(--panel)}
.matrix td.hi{background:var(--gold-soft)}

/* piano */
.gantt{min-width:760px;display:flex;flex-direction:column;gap:6px}
.g-row{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;align-items:center}
.g-label{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-label .n{font-family:var(--serif);color:var(--ink2);margin-right:8px}
.g-track{position:relative;height:22px;background:var(--panel)}
.g-head .g-track{background:transparent;height:20px}
.g-month{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--ink2);padding-left:4px;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.g-bar{position:absolute;top:5px;height:12px;min-width:8px;border-radius:2px;background:var(--sand)}
.g-bar.fatto{background:var(--ink)}
.g-bar.in-corso{background:var(--gold-fill)}
.g-today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--crit)}
.fase-blk{border-top:1px solid var(--ink);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.fase-head{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:6px 16px;align-items:start}
.fase-head .n{font-family:var(--serif);font-size:30px;line-height:1;color:var(--sand);font-variant-numeric:tabular-nums}
.fase-blk.fatto .n{color:var(--ink)}
.fase-blk.in-corso .n{color:var(--gold)}
.fase-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nota{border-left:2px solid var(--gold-fill);padding-left:10px;font-size:14px}
.tasks{display:flex;flex-direction:column;margin-left:64px}
.task{display:grid;grid-template-columns:96px minmax(0,1fr) 150px 104px auto;gap:4px 14px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline;font-size:14px}
.task.fatto .tt{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--sand)}
.task .when{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2);text-align:right}
.task .chi{font-size:13px;color:var(--ink2)}

/* righe generiche */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);color:var(--ink2);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) auto auto;gap:6px 16px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:1px solid var(--line)}
.row .when{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.row .what{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .what .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .amount{font-family:var(--serif);font-size:19px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .side{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.risk{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto;gap:8px 24px;padding:18px 0;border-top:1px solid var(--line)}
.risk:last-child{border-bottom:1px solid var(--line)}
.risk .rk{display:flex;flex-direction:column;gap:6px;min-width:0}
.risk .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.group{display:flex;flex-direction:column;gap:4px}
.group > h4{padding-bottom:6px}

.chart{width:100%;min-width:640px;height:auto;display:block}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--ink2)}
.chart .lab{font-family:var(--serif);font-size:15px;fill:var(--ink)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--sand);stroke-width:1}
.chart .area{fill:var(--gold-soft)}
.chart .step{fill:none;stroke:var(--ink);stroke-width:2}
.chart .dot{fill:var(--ink);stroke:var(--bg);stroke-width:2}
.chart .mark{stroke:var(--gold-fill);stroke-width:1.5;stroke-dasharray:4 3}

.entry{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 24px;padding:24px 0;border-top:1px solid var(--line)}
.entry:last-child{border-bottom:1px solid var(--line)}
.entry .date{font-family:var(--serif);font-size:18px;color:var(--ink2)}
.entry-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.entry-body p{max-width:65ch;white-space:pre-line}
.entry-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.entry-docs{display:flex;gap:8px;flex-wrap:wrap}
.btn.doc{display:inline-flex;gap:12px;align-items:center;text-decoration:none;font-size:15px;padding:10px 16px;max-width:100%;text-align:left;line-height:1.25}
.btn.doc .ico{flex:none;width:24px;height:24px;fill:none;stroke:var(--gold-fill);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn.doc .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.btn.doc .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.btn.doc .go{flex:none;font-size:14px;border:1px solid currentColor;border-radius:999px;padding:5px 12px;white-space:nowrap}
.scelte{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto;border:1px solid var(--line);padding:10px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.photos button{padding:0;border:0;background:var(--panel);cursor:zoom-in;aspect-ratio:4/3;max-width:100%;overflow:hidden;display:block}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .broken{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);cursor:default}

.empty{background:var(--panel);padding:36px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{max-width:52ch;color:var(--ink2)}
.notice{background:var(--panel);border-left:3px solid var(--gold-fill);padding:12px 16px;font-size:14px}
.notice.warn{border-left-color:var(--warn)}
footer{border-top:1px solid var(--line);padding-block:20px 8px;font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:0;width:min(580px,calc(100% - 32px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.form{display:flex;flex-direction:column;gap:16px;padding:24px}
.form h2{font-size:24px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--sand);padding:9px 10px;border-radius:2px;width:100%;min-width:0}
.field textarea{min-height:88px;resize:vertical}
.field .hint{font-size:12px;color:var(--ink2)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.form-actions .right{display:flex;gap:8px;margin-left:auto}
.form-msg{font-size:13px;color:var(--ink2);min-height:1.2em}
.form-msg.err{color:var(--crit)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:84px;display:flex;flex-direction:column;gap:4px}
.thumb img{width:84px;height:64px;object-fit:cover;display:block;background:var(--panel)}
.thumb.removed img{opacity:.25}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.check input{width:auto}
#lb{width:min(1000px,calc(100% - 24px));background:var(--band);border:0}
#lb img{display:block;max-width:100%;max-height:80vh;margin:auto}
#lb .lb-bar{display:flex;justify-content:flex-end;padding:8px}
#lb .btn{background:transparent;color:var(--on-band);border-color:var(--band-line)}

@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-main{padding:22px 0}
  .hero-side{border-left:0;border-top:1px solid var(--line)}
  .hero-side .fig,.hero-side .fig + .fig{padding-left:0}
  .figures{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fig:nth-child(3){padding-left:0;border-left:0}
  .fig:nth-child(n+3){border-top:1px solid var(--line)}
  .cols,.cols3{grid-template-columns:minmax(0,1fr)}
  .schema{grid-template-columns:minmax(0,1fr)}
  .schema .arrow{max-width:none}
  .regole,.scheda{grid-template-columns:minmax(0,1fr)}
  .regole dd,.scheda dd{border-top:0;padding-top:0}
  .scheda dt{padding-bottom:2px}
  .regole dt{padding-bottom:4px}
  .fase-head{grid-template-columns:36px minmax(0,1fr)}
  .fase-meta{grid-column:2;justify-content:flex-start}
  .tasks{margin-left:0}
  .task{grid-template-columns:auto minmax(0,1fr)}
  .task .tt{grid-column:1 / -1;order:-1}
  .task .when{text-align:left}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .when,.row .side{grid-column:1 / -1}
  .row .side{justify-content:flex-start}
  .risk{grid-template-columns:minmax(0,1fr)}

      var inpF = h('input', { id:id, type:'file', accept:'image/jpeg,image/png,image/webp', multiple:true });
      el = { input: inpF, items: (valori[f.k] || []).map(function(a){ return { id:a, tolta:false }; }) };
      var thumbs = h('div', { class:'thumbs' }, el.items.map(function(it){
        var box = h('div', { class:'thumb' }, h('img', { src:blob(it.id), alt:'' }));
        box.appendChild(h('button', { class:'link', type:'button', onclick:function(ev){
          it.tolta = !it.tolta; box.classList.toggle('removed', it.tolta);
          ev.currentTarget.textContent = it.tolta ? 'Rimetti' : 'Togli';
        } }, 'Togli'));
        return box;
      }));
      corpo = [el.items.length ? thumbs : null, inpF];
    } else {
      el = h('input', { id:id, type:f.tipo || 'text', required:f.obbl,
        step:f.tipo === 'number' ? (f.step || '0.01') : null, min:f.tipo === 'number' ? '0' : null,
        placeholder:f.segnaposto, inputmode:f.tipo === 'number' ? 'decimal' : null });
      el.value = valori[f.k] != null ? valori[f.k] : (f.def != null ? f.def : '');
      corpo = el;
    }
    ctl[f.k] = el;
    var campo = h('div', { class:'field' }, h('label', { for:id }, f.label), corpo, f.aiuto ? h('span', { class:'hint' }, f.aiuto) : null);
    if (f.meta) {
      if (riga) { riga.appendChild(campo); riga = null; }
      else { riga = h('div', { class:'pair' }, campo); campi.push(riga); }
    } else { riga = null; campi.push(campo); }
  });

  var bSalva = h('button', { class:'btn', type:'submit' }, 'Salva');
  var bAnnulla = btn('Annulla', function(){ dlg.close(); }, 'ghost');
  var bElimina = null, conferma = false;
  if (cfg.onElimina) {
    bElimina = btn('Elimina', function(){
      if (occupato) return;
      if (!conferma) { conferma = true; bElimina.textContent = 'Conferma eliminazione'; return; }
      stato(true, 'Elimino…');
      cfg.onElimina().then(function(){ dlg.close(); }, function(e){ stato(false, errore(e), true); });
    }, 'danger');
  }
  function stato(on, testo, err){
    occupato = on;
    bSalva.disabled = on; bAnnulla.disabled = on; if (bElimina) bElimina.disabled = on;
    msg.textContent = testo || ''; msg.className = 'form-msg' + (err ? ' err' : '');
  }
  var form = h('form', { class:'form' }, h('h2', {}, cfg.titolo), campi, msg,
    h('div', { class:'form-actions' }, bElimina, h('div', { class:'right' }, bAnnulla, bSalva)));
  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    if (occupato) return;
    stato(true, 'Salvo…');
    var vals = {}, daTogliere = [], coda = Promise.resolve();
    cfg.campi.forEach(function(f){
      var el = ctl[f.k];
      if (!el) { if (f.tipo === 'file' || f.tipo === 'foto') vals[f.k] = valori[f.k] || (f.tipo === 'foto' ? [] : null); return; }
      if (f.tipo === 'file') {
        var cur = valori[f.k] && valori[f.k].id ? valori[f.k] : null;
        if (el.togli && el.togli.checked && cur) { daTogliere.push(cur.id); cur = null; }
        var file = el.input.files[0];
        if (file) {
          coda = coda.then(function(){ stato(true, 'Carico il file…'); return carica(file); }).then(function(a){
            if (cur) daTogliere.push(cur.id);
            vals[f.k] = a;
          });
        } else vals[f.k] = cur;
      } else if (f.tipo === 'foto') {
        var tieni = el.items.filter(function(i){ return !i.tolta; }).map(function(i){ return i.id; });
        el.items.forEach(function(i){ if (i.tolta) daTogliere.push(i.id); });
        var files = Array.prototype.slice.call(el.input.files);
        files.forEach(function(file, n){
          coda = coda.then(function(){ stato(true, 'Carico la foto ' + (n + 1) + ' di ' + files.length + '…'); return carica(file); })
                     .then(function(a){ tieni.push(a.id); });
        });
        vals[f.k] = tieni;
      } else if (f.tipo === 'scelte') {
        vals[f.k] = el.caselle.filter(function(c){ return c.checked; }).map(function(c){ return c.value; });
      } else if (f.tipo === 'number') {
        vals[f.k] = el.value === '' ? null : Number(el.value);
      } else vals[f.k] = el.value.trim();
    });
    coda.then(function(){ stato(true, 'Salvo…'); return cfg.onSalva(vals); }).then(function(){
      daTogliere.forEach(function(a){ if (S.assets) S.assets.delete(a).catch(function(){}); });
      dlg.close();
    }, function(e){ stato(false, errore(e), true); });
  });
  dlg.replaceChildren(form);
  dlg.showModal();
}

      lista.length ? h('div', { class:'rows' }, lista.map(function(m){
        var vers = m.tipo === 'versamento';
        var dett = vers ? [nomeParte(m.societa)] : [m.controparte, nomeVoce(m.voce), m.numero ? 'fatt. ' + m.numero : '', m.intestata ? 'intestata a ' + nomeParte(m.intestata) : '',
          m.stato === 'pagato' ? (m.dataPagamento ? 'pagata il ' + data(m.dataPagamento) : '') : (m.scadenza ? 'scade il ' + data(m.scadenza) : '')];
        return h('div', { class:'row' }, h('span', { class:'when' }, data(m.data)),
          h('div', { class:'what' }, h('strong', {}, m.descrizione || (vers ? 'Versamento di capitale' : 'Spesa')), h('span', { class:'small muted' }, dett.filter(Boolean).join(' · '))),
          h('div', { class:'side' }, allegato(m.allegato), vers ? pill('gold', 'Versamento') : m.stato === 'pagato' ? pill('ok', 'Pagata') : pill('warn', 'Da pagare'),
            modifica(function(){ (vers ? editVersamento : editCosto)(m); })),
          h('span', { class:'amount' }, (vers ? '+ ' : '') + eur(m.importo)));
      })) : vuoto(S.mov.length ? 'Nessun movimento con questo filtro.' : 'Nessun movimento registrato finora. Fatture, pagamenti e versamenti di capitale compariranno qui, ognuno con il suo allegato.',
        S.mov.length ? null : btn('Registra il primo movimento', function(){ editCosto(); })))
  ];
  return [pz[0], pz[5], pz[7], h('div', {}, acc('c-budget', 'Dettaglio per voce di costo', [pz[6]]), acc('c-piano', 'Calendario delle uscite', [pz[1], pz[2], pz[3], pz[4]]))];
}

/* ---------- Rischi ---------- */
function vRischi(){
  var liv = { bassa:'neutral', media:'warn', alta:'crit', basso:'neutral', medio:'warn', alto:'crit' };
  var st = { aperto:['warn','Aperto'], presidiato:['gold','Presidiato'], chiuso:['ok','Chiuso'] };
  return [
    testa('Rischi e presìdi', S.op.rischiNota, btn('Aggiungi rischio', function(){ editRischio(); })),
    S.rischi.length ? h('div', {}, S.rischi.map(function(r){
      var s = st[r.stato] || st.aperto;
      return h('div', { class:'risk' },
        h('div', { class:'rk' }, h('h3', {}, r.titolo), r.descr ? h('p', { class:'small muted' }, r.descr) : null,
          h('div', { class:'tags' }, pill(liv[r.prob] || 'neutral', 'Probabilità ' + (r.prob || '–')), pill(liv[r.impatto] || 'neutral', 'Impatto ' + (r.impatto || '–')))),
        h('div', { class:'rk' }, h('h4', {}, 'Come lo gestiamo'), h('p', {}, r.mitigazione || ''), r.chi ? h('p', { class:'small muted' }, 'Responsabile: ' + r.chi) : null),
        h('div', { class:'tags', style:'align-content:start;justify-content:flex-end' }, pill(s[0], s[1]), modifica(function(){ editRischio(r); })));
    })) : vuoto('Nessun punto registrato.', btn('Aggiungi il primo punto', function(){ editRischio(); }))
  ];
}

/* ---------- Documenti ---------- */
function vDocumenti(){
  var cats = CATEGORIE.slice();
  /* le versioni superate restano in archivio per il gestore: alle Proprietarie si mostra solo il documento valido */
  var docs = S.doc.filter(function(d){ return S.canEdit || d.sotto !== 'Versioni precedenti'; });
  docs.forEach(function(d){ if (d.categoria && cats.indexOf(d.categoria) < 0) cats.push(d.categoria); });
  function quanti(n){ return n + (n === 1 ? ' documento' : ' documenti'); }
  function rigaDoc(d){
    var url = httpUrl(d.link);
    return h('div', { class:'row' }, h('span', { class:'when' }, data(d.data)),
      h('div', { class:'what' }, h('strong', {}, d.titolo), d.nota ? h('span', { class:'small muted' }, d.nota) : null),
      h('div', { class:'side' }, allegato(d.file), url ? h('a', { href:url, target:'_blank', rel:'noopener', class:'small' }, 'Apri') : null,
        !d.file && !url ? h('span', { class:'small muted' }, 'Da caricare') : null),
      modifica(function(){ editDoc(d); }) || h('span', {}));
  }
  function cartella(chiave, nome, n, corpo, sotto){
    return accEl(chiave, false, 'cartella' + (sotto ? ' sotto' : ''), h('summary', {}, h('span', { class:'nome' }, nome), h('span', { class:'small muted' }, quanti(n))), corpo);
  }
  var lista = cats.map(function(cat){
    var ds = docs.filter(function(d){ return (d.categoria || 'Altro') === cat; });
    if (!ds.length) return null;
    var sotto = [];
    ds.forEach(function(d){ if (d.sotto && sotto.indexOf(d.sotto) < 0) sotto.push(d.sotto); });
    sotto.sort();
    var sciolti = ds.filter(function(d){ return !d.sotto; });
    return cartella('d-' + cat, cat, ds.length, h('div', { class:'cartella-body' },
      sotto.map(function(k){
        var dk = ds.filter(function(d){ return d.sotto === k; });
        return cartella('d-' + cat + '/' + k, k, dk.length, h('div', { class:'rows' }, dk.map(rigaDoc)), true);
      }),
      sciolti.length ? h('div', { class:'rows' }, sciolti.map(rigaDoc)) : null));
  }).filter(Boolean);
  return [
    testa('Documenti', docs.length ? quanti(docs.length) + ' in ' + lista.length + ' cartelle. Apri una cartella per vedere cosa contiene.' : '', btn('Aggiungi documento', function(){ editDoc(); })),
    lista.length ? h('div', {}, lista) : vuoto('Nessun documento caricato.', btn('Aggiungi il primo documento', function(){ editDoc(); }))
  ];
}

/* ---------- Diario ---------- */
function docValidi(){ return S.doc.filter(function(d){ return d.sotto !== 'Versioni precedenti'; }); }
/* documenti richiamati da un aggiornamento: quelli spuntati dal gestore; se non ne ha spuntati, quelli citati col titolo esatto */
function docRichiamati(x){
  var validi = docValidi();
  if (Array.isArray(x.documenti)) return validi.filter(function(d){ return x.documenti.indexOf(d.id) >= 0; });
  var t = ((x.titolo || '') + ' ' + (x.testo || '')).toLowerCase();
  return validi.filter(function(d){ return d.titolo && d.titolo.length > 5 && t.indexOf(d.titolo.toLowerCase()) >= 0; });
}
function pulsanteDoc(d){
  var url = httpUrl(d.link), f = d.file && d.file.id ? d.file : null;
  var ico = sv('svg', { class:'ico', viewBox:'0 0 24 24', 'aria-hidden':'true' });
  ico.appendChild(sv('path', { d:'M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h6' }));
  var testo = [ico, h('span', { class:'t' }, h('span', { class:'k' }, 'Documento'), d.titolo), h('span', { class:'go' }, 'Apri ›')];
  if (f && /^image\//.test(f.tipo || '')) return h('button', { class:'btn doc', type:'button', onclick:function(){ lightbox(f.id); } }, testo);
  if (f || url) return h('a', { class:'btn doc', href: f ? blob(f.id) : url, target:'_blank', rel:'noopener' }, testo);
  return h('button', { class:'btn doc', type:'button', onclick:function(){ vai('documenti'); } }, testo);
}
function voceDiario(x){
  var richiamati = docRichiamati(x);
  var fase = S.fasi.filter(function(f){ return f.id === x.fase; })[0];
  return h('article', { class:'entry' },
    h('div', { class:'date' }, data(x.data)),
    h('div', { class:'entry-body' },
      h('div', { class:'entry-head' }, h('h3', {}, x.titolo), fase ? pill('neutral', fase.titolo) : null, modifica(function(){ editDiario(x); })),
      x.testo ? h('p', {}, x.testo) : null,
      richiamati.length ? h('div', { class:'entry-docs' }, richiamati.map(pulsanteDoc)) : null,
      (x.foto || []).length ? h('div', { class:'photos' }, x.foto.map(function(id){
        var b = h('button', { type:'button', 'aria-label':'Ingrandisci la foto', onclick:function(){ lightbox(id); } });
        var img = h('img', { src:blob(id), alt:'Foto: ' + (x.titolo || ''), loading:'lazy' });
        img.addEventListener('error', function(){ b.replaceChildren('Foto non disponibile'); b.className = 'broken'; b.disabled = true; });
        b.appendChild(img);
        return b;
      })) : null));
}
function vDiario(){
  return [
    testa('Aggiornamenti', 'L’informativa periodica sull’operazione: lavori, spese, scostamenti, vendite e incassi, dal più recente.', btn('Nuovo aggiornamento', function(){ editDiario(); })),
    !S.assets && S.canEdit ? h('p', { class:'notice warn' }, 'Da questa vista non si possono caricare foto: apri la pagina dal tuo account su claude.ai.') : null,
    S.diario.length ? h('div', {}, S.diario.map(voceDiario)) : vuoto('Ancora nessun aggiornamento. Il primo arriverà con la firma del contratto di gestione.', btn('Scrivi il primo aggiornamento', function(){ editDiario(); }))
  ];
}

function lightbox(id){ $('#lb-img').src = blob(id); $('#lb').showModal(); }
$('#lb-close').addEventListener('click', function(){ $('#lb').close(); });
$('#lb').addEventListener('click', function(e){ if (e.target === e.currentTarget) e.currentTarget.close(); });

/* ---------- disegno ---------- */
function vai(v){ v = ALIAS[v] || v; try { location.hash = v; } catch (e) {} S.view = v; render(); window.scrollTo(0, 0); }
function render(){
  $('#nav').replaceChildren.apply($('#nav'), VIEWS.map(function(v){
    var ico = sv('svg', { class:'ico', viewBox:'0 0 24 24', 'aria-hidden':'true' });
    ico.appendChild(sv('path', { d: ICONE[v[0]] || '' }));
    return h('button', { type:'button', 'aria-current': S.view === v[0] ? 'page' : null, 'aria-label': v[1], onclick:function(){ vai(v[0]); } },
      ico, h('span', { class:'lungo' }, v[1]), h('span', { class:'corto' }, CORTI[v[0]] || v[1]));
  }));
  $('#role').textContent = S.status !== 'ok' ? 'Area riservata dell’operazione' : S.canEdit ? 'Gestione · puoi modificare' : 'Area riservata · sola lettura';
  $('#sync').textContent = S.slow ? 'Dati non ancora raggiungibili: potrebbero non essere aggiornati.' : '';
  var out;
  if (S.status === 'nodb') out = h('div', { class:'empty' }, h('h2', {}, 'Dati non disponibili'), h('p', {}, 'Per vedere l’operazione apri questa pagina da claude.ai con il tuo account.'));
  else if (S.status === 'error') out = h('div', { class:'empty' }, h('h2', {}, 'Dati non raggiungibili'), h('p', {}, 'Non è stato possibile leggere i dati dell’operazione. Ricarica la pagina tra qualche minuto.'));
  else if (S.op === undefined) out = h('div', { class:'empty' }, h('p', {}, S.slow ? 'I dati non rispondono ancora. La pagina si aggiorna da sola appena arrivano.' : 'Carico i dati dell’operazione…'));
  else if (S.op === null) out = h('div', { class:'empty' }, h('h2', {}, 'Operazione non ancora creata'), h('p', {}, 'Qui compariranno struttura, piano economico, piano d’azione, conti, documenti e foto dell’operazione.'), S.canEdit ? btn('Crea l’operazione', editOp) : null);
  else {
    try { out = ({ oggi:vOggi, cassa:vConti, piano:vAvanzamento, diario:vDiario, documenti:vDocumenti }[S.view] || vOggi)(); }
    catch (e) {
      if (window.console) console.error(e);
      out = h('div', { class:'empty' }, h('h2', {}, 'Questa pagina non si è aperta'),
        h('p', {}, 'Riprova tra poco oppure torna alla pagina iniziale. Se succede ancora, segnalalo a Gusmeroli S.R.L.'),
        btn('Torna a Oggi', function(){ vai('oggi'); }), h('p', { class:'small muted' }, 'Dettaglio tecnico: ' + (e && e.message ? e.message : e)));
    }
  }
  var view = $('#view');
  view.replaceChildren();
  appendAll(view, [out]);
}
function leggiHash(){
  var v = (location.hash || '').replace('#', '');
  v = ALIAS[v] || v;
  if (VIEWS.some(function(x){ return x[0] === v; })) S.view = v;
}
window.addEventListener('hashchange', function(){ leggiHash(); render(); });
$('#casa').addEventListener('click', function(ev){ ev.preventDefault(); vai('oggi'); });

/* ---------- avvio ---------- */
function avvia(){
  leggiHash(); render();
  var use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
  if (!use) { S.status = 'nodb'; render(); return; }
  Promise.all([use('db'), use('user'), use('assets')]).then(function(r){
    var db = r[0], user = r[1];
    S.db = db; S.assets = r[2];
    if (!db) { S.status = 'nodb'; render(); return; }
    S.status = 'ok';
    (user ? user.canEdit() : Promise.resolve(false)).then(function(ok){ S.canEdit = !!ok; render(); });
    var timer = setTimeout(function(){ S.slow = true; render(); }, 10000);
    function arrivato(snap){ if (!snap.metadata || !snap.metadata.fromCache) { clearTimeout(timer); S.slow = false; } }
    function ko(){ clearTimeout(timer); S.status = 'error'; render(); }
    db.doc('op/' + OP_ID).onSnapshot(function(snap){ arrivato(snap); S.op = snap.exists ? snap.data() : null; render(); }, ko);
    function ascolta(nome, chiave, ordina){
      db.collection(nome).onSnapshot(function(snap){
        arrivato(snap);
        S[chiave] = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); }).sort(ordina);
        render();
      }, ko);
    }
    ascolta('fasi', 'fasi', byOrdine);
    ascolta('azioni', 'azioni', byOrdine);
    ascolta('cassa', 'cassa', byOrdine);
    ascolta('rischi', 'rischi', byOrdine);
    ascolta('lavori', 'lavori', byOrdine);
    ascolta('decisioni', 'decisioni', function(a, b){ return String(a.scadenza || '').localeCompare(String(b.scadenza || '')); });
    ascolta('movimenti', 'mov', byDataDesc);
    ascolta('documenti', 'doc', byDataDesc);
    ascolta('diario', 'diario', byDataDesc);
  }).catch(function(){ S.status = 'error'; render(); });
}
avvia();
})();
</script>
<script>
(function(){
  var V = '5b972e344b5e';
  function controlla(){
    fetch('versione.txt?t=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.ok ? r.text() : ''; }).then(function(t){
      t = (t || '').trim();
      if (!t || t === V) return;
      if (document.querySelector('dialog[open]') || document.getElementById('accesso')) return;   /* non interrompo chi sta scrivendo o entrando */
      try { if (sessionStorage.getItem('gusmeroli-agg') === t) return; sessionStorage.setItem('gusmeroli-agg', t); } catch (e) {}
      location.replace(location.pathname + '?v=' + t + location.hash);
    }).catch(function(){});
  }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) controlla(); });
  window.addEventListener('pageshow', controlla);
  setInterval(controlla, 180000);
})();
</script>
